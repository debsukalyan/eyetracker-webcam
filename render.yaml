# Database is NOT hosted on Render anymore — Render's free Postgres expires after
# ~30 days and gets suspended, taking the app down. Instead we use an external
# free Postgres (Neon) that doesn't expire. Set DATABASE_URL in the Render
# dashboard to the Neon connection string (Neon → your project → Connection string,
# the postgresql://… URI, which already includes ?sslmode=require).
#
# The web service stays on Render's free plan (it just sleeps ~50s between visits).
# NOTE: free plan has no persistent disk, so uploaded stimuli / screenshots /
# recordings live in the database (blobs table), not on disk.
services:
  - type: web
    name: eyetrack
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in the dashboard to the Neon URI
      - key: EYETRACK_STORAGE
        value: /data/storage
