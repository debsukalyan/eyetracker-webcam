<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Use 'localhost' so generated participant links also use localhost
       (WebGazer's secure-origin check rejects 127.0.0.1). -->
  <script>
    if (location.hostname === '127.0.0.1') {
      location.replace(location.protocol + '//localhost:' + location.port + location.pathname + location.search);
    }
  </script>
  <title>In-House Eye-Tracking — Researcher Console</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">👁 EyeTrack<span class="dot">.</span> <span class="muted" style="font-weight:400">Researcher Console</span></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="nav-studies">Studies</button>
    <button class="btn secondary" id="nav-new">+ New study</button>
  </div>
  <div class="container" id="app"></div>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
